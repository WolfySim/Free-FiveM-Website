<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06030c;--panel:#0f0a1c;--line:#2d1f52;--text:#f1ecff;--mute:#a99dc8;--cyan:#b46bff;--pink:#7a2cf0;--gold:#e9e4f7}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 15% 0,#b46bff26,transparent),radial-gradient(700px 500px at 90% 20%,#7a2cf033,transparent),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px)}
h1,h2,h3,.logo{font-family:Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:#06030cd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:16px}
.logo img{width:40px;height:40px;object-fit:contain}
.links{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--mute)}
.links a:hover{color:var(--cyan)}
.btn{display:inline-block;padding:12px 26px;border-radius:8px;font-weight:600;border:1px solid var(--cyan);color:var(--cyan);transition:.2s}
.btn:hover{background:var(--cyan);color:#000;box-shadow:0 0 24px #b46bff77}
.btn.fill{background:linear-gradient(90deg,var(--pink),#b46bff);border:0;color:#fff}
.btn.fill:hover{box-shadow:0 0 28px #7a2cf088;color:#fff;background:linear-gradient(90deg,var(--pink),#b46bff)}
.hero{text-align:center;padding:90px 0 70px}
.hero img{width:min(320px,70vw);height:auto;filter:drop-shadow(0 0 30px #b46bffaa);margin-bottom:6px}
h1{font-size:clamp(2.2rem,7vw,4.6rem);font-weight:400;line-height:1.05;background:linear-gradient(90deg,var(--gold),var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:560px;margin:18px auto 30px;color:var(--mute);font-size:1.1rem}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font:400 1.8rem Anton;color:var(--gold)}
.stat span{color:var(--mute);font-size:.85rem}
section{padding:60px 0}
h2{font-size:1.7rem;margin-bottom:8px}
h2::after{content:"";display:block;width:60px;height:3px;margin-top:8px;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.sub{color:var(--mute);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 8px 30px #b46bff26}
.card .ico{font-size:2rem}
.card h3{font-size:1.05rem;margin:10px 0 6px}
.card p{color:var(--mute);font-size:.93rem}
.tag{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:99px;font-size:.75rem;background:#b46bff22;color:var(--cyan)}
.tag.p{background:#7a2cf033;color:var(--pink)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.spot{border-left:3px solid var(--gold)}
.spot q{display:block;margin:10px 0;font-style:italic;color:var(--text)}
.event{text-align:center;background:linear-gradient(135deg,#b46bff14,#7a2cf022);border:1px solid var(--line);border-radius:16px;padding:40px 20px}
.event h3{font-size:1.8rem;color:var(--gold);margin:6px 0 22px}
.count{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.count div{min-width:74px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.count b{display:block;font:400 1.9rem Anton;color:var(--cyan)}
.count small{color:var(--mute);font-size:.7rem;text-transform:uppercase}
.join{text-align:center;padding:70px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:40px 20px;border-top:1px solid var(--line);margin-top:60px}
@media(max-width:720px){.links{gap:12px;font-size:12px}.links .btn{padding:8px 12px}.logo{font-size:0}.logo img{width:36px;height:36px}.split,.stats{grid-template-columns:1fr}.count div{min-width:62px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.page{padding:56px 0 10px;text-align:center}
.page h1{font-size:clamp(2rem,6vw,3.4rem)}
.page p{color:var(--mute);max-width:560px;margin:12px auto 0}
.links a.on{color:var(--cyan)}
.card .meta{margin-top:12px;font-size:.85rem;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.card .meta b{color:var(--text)}
.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font:400 1.6rem Anton;background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff}
.person{text-align:center}
.person .tag{margin-top:6px}
.list{display:grid;gap:12px}
.row{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.row .date{min-width:64px;text-align:center;font:400 1.5rem Anton;color:var(--gold);line-height:1.1}
.row .date small{display:block;font:600 .7rem Inter;color:var(--cyan);letter-spacing:.1em}
.row p{color:var(--mute);font-size:.9rem}
form{display:grid;gap:16px;max-width:640px;margin:0 auto}
label{font-weight:600;font-size:.9rem;display:grid;gap:6px}
input,textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cyan);border-color:transparent}
textarea{min-height:110px;resize:vertical}
.note{color:var(--mute);font-size:.85rem;text-align:center}
.ok{display:none;text-align:center;color:var(--gold)}
</style>
</head>
